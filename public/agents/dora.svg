    <circle cx="200" cy="175" r="82" fill="#14121d" stroke="url(#ring-dora)" stroke-width="3"/>
    <text x="200" y="206" font-size="76" text-anchor="middle" dominant-baseline="middle">🛡️</text>
  </g>
  <rect x="70" y="295" width="260" height="52" rx="26" fill="#110f18" stroke="#eab308" stroke-width="2" stroke-opacity="0.8"/>
  <text x="200" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Dora</text>
