<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-dora" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#713f12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09080e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ring-dora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow-dora" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
