  </defs>
  <circle cx="200" cy="200" r="180" fill="url(#bg-dora)" stroke="#eab308" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4"/>
